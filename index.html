<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Expense & Budget Visualizer</h1>
      <button id="themeToggle" class="ghost" type="button" aria-label="Toggle dark mode">Dark mode</button>
    </header>

    <section class="card balance">
      <p class="label">Total balance</p>
      <p id="totalBalance" class="amount">Rp 0</p>
      <div class="limit-row">
        <label for="limitInput">Spending limit per item</label>
        <input id="limitInput" type="number" min="0" step="any" placeholder="e.g. 100000">
      </div>
    </section>

    <section class="card">
      <h2>Add transaction</h2>
      <form id="txForm" novalidate>
        <label for="name">Item name</label>
        <input id="name" type="text" placeholder="e.g. Nasi goreng">

        <label for="amount">Amount</label>
        <input id="amount" type="number" min="0" step="any" placeholder="e.g. 25000">

        <label for="category">Category</label>
        <select id="category">
          <option value="">Select category</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Fun">Fun</option>
        </select>

        <p id="error" class="error" role="alert"></p>
        <button type="submit" class="primary">Add transaction</button>
      </form>
    </section>

    <div class="grid">
      <section class="card">
        <div class="list-head">
          <h2>Transactions</h2>
          <select id="sort" aria-label="Sort transactions">
            <option value="newest">Newest first</option>
            <option value="amount-desc">Amount: high to low</option>
            <option value="amount-asc">Amount: low to high</option>
            <option value="category">Category</option>
          </select>
        </div>
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty">No transactions yet. Add your first one above.</p>
      </section>

      <section class="card">
        <h2>Spending by category</h2>
        <div class="chart-wrap"><canvas id="chart"></canvas></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
